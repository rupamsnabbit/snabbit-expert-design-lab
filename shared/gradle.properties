# Mirrors android/gradle.properties so the standalone :shared build behaves
# identically to how it builds under the android host. Keep in sync.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G
kotlin.jvm.target.validation.mode=warning
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
