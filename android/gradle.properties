org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G
# Some third-party Flutter plugins (e.g. photo_manager) leave Kotlin's jvmTarget at the toolchain
# default (21) while their Java stays 17, tripping Kotlin 2.x's JVM-target consistency check. Both
# compiles succeed individually and D8 normalizes the mix at dex time, so downgrade the check to a
# warning (JetBrains' sanctioned workaround for plugin target mismatches).
kotlin.jvm.target.validation.mode=warning
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
