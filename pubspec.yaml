dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

  # Testing dependencies
  #
  # Version coupling — DO NOT bump these blindly (see pigeon below):
  #   pigeon 27 needs analyzer >=10 <13  →  mockito must stay 5.6.4 (5.6.5/5.7.0
  #   require analyzer ^13, which conflicts). build_runner is capped <2.14.0 because
  #   2.14.0+ AOT-compiles its build script by default, which fails on Dart 3.10.7
  #   with "'dart compile' does not support build hooks" (dart-lang/sdk#62593, still
  #   open). 2.13.1 is JIT-default and supports analyzer 12, so codegen needs no flag.
  mockito: ^5.6.4
  build_runner: ">=2.4.13 <2.14.0"
  flutter_native_splash: ^2.4.1

  # Pigeon — type-safe platform-channel codegen for the KMP navigation bridge
  # (method channel @HostApi + event channel @EventChannelApi). Source of truth:
  # pigeons/navigation_api.dart; generated code is committed (see PigeonOptions).
  # See the version-coupling note above before bumping (pigeon ↔ mockito ↔ analyzer).
  pigeon: ^27.1.0
