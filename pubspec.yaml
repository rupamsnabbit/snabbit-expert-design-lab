name: snabbit_runner
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.0.9+174

environment:
  sdk: ">=3.4.1 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  pinput: ^5.0.0
  http: ^1.2.1
  flutter_svg: ^2.1.0
  google_maps_flutter: ^2.7.0
  location: ^8.0.1
  geolocator: ^14.0.2
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  dio: ^5.4.3+1
  # Debug-only HTTP inspector (Chucker Android port). Wired only behind
  # kDebugMode in lib/services/debug/network_inspector.dart, and the package
  # itself defaults to showOnRelease=false, so it never runs and is
  # tree-shaken out of profile/release builds. See that file for the gate.
  chucker_flutter: ^1.9.2
  sms_autofill: ^2.4.0
  otpless_headless_flutter: ^1.0.4
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.3
  logger: ^2.3.0
  # awesome_ripple_animation: ^2.0.0
  url_launcher: ^6.3.0
  crypto: ^3.0.7
  flutter_inappwebview: ^6.1.5
  flutter_animate: ^4.5.0
  permission_handler: ^12.0.1
  action_slider: ^0.7.0
  flutter_rating_bar: ^4.0.1
  # TODO(firebase-unpin): pinned to the last coherent FlutterFire train — the 4.12.0/5.2.5 train
  # references `FirebasePlugin` which firebase_core_platform_interface 7.1.0 doesn't provide (upstream
  # desync). Restore ^ ranges once FlutterFire ships a coherent train.
  firebase_core: 4.11.0
  firebase_analytics: 12.4.3
  firebase_messaging: 16.4.1
  device_info_plus: ^12.1.0
  android_id: ^0.5.1
  uuid: ^4.0.0
  disk_space_2: ^1.0.12
  flutter_local_notifications: ^19.4.2
  vibration: ^3.1.4
  audioplayers: ^6.0.0
  format: ^1.5.2
  flutter_volume_controller: ^1.3.2
  flutter_launcher_icons: ^0.14.4
  connectivity_plus: ^7.0.0
  flutter_tts: ^4.0.2
  flutter_background_service: ^5.0.10
  carousel_slider: ^5.1.1
  package_info_plus: ^9.0.0
  flutter_contacts: ^1.1.9+2
  battery_plus: ^7.0.0
  fluttertoast: ^9.0.0
  dotted_line: ^3.2.3
  share_plus: ^12.0.0
  video_player: ^2.9.3
  chewie: ^1.10.0
  flutter_staggered_grid_view: ^0.7.0
  firebase_crashlytics: 5.2.4 # firebase-unpin (see firebase_core note)
  firebase_performance: 0.11.4+3 # firebase-unpin
  cx_flutter_plugin: ^0.0.5
