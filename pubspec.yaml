  open_filex: ^4.7.0
  image_picker: ^1.1.2
  lottie: ^3.2.0
  cached_network_image: ^3.4.1
  camera: ^0.11.2+1
  record: ^6.1.2
  sqflite: ^2.4.2
  pointycastle: ^4.0.0
  asn1lib: ^1.5.8
  shorebird_code_push: ^2.0.5
  firebase_remote_config: 6.5.3 # firebase-unpin
  comm_stream:
    git:
      url: git@github.com:snabbit-tech/snabbit-comm.git
      path: packages/comm_stream
      ref: p2p-chat-no-video
  #  installed_apps: ^1.3.1
  network_info_plugin:
    git:
      url: git@github.com:snabbit-tech/app-packages.git
      path: packages/network_info_plugin
      ref: feature/network-info-plugin
  hybrid_flutter:
    git:
      url: https://x-token-auth:ATCTT3xFfGN0YHcLshyRdO6f8CcVPi-HJEZAm-WcSCkrGea0agKgfjb1cVmVXHa8kPacYWyj9_aUoNhaMpG_nfOW-3soAIXZeB2LaOphGRHiZt4mlKZtI4XQsJGIbpuxJg4nTYr4LJh0thwo8nuUt2huyDpXk05KFmINc2y93Ug31Ya-eos-i6E%3D3D3A0925@bitbucket.org/cross-platform-plugins/flutter_hybrid_plugin.git
      ref: 1.0.6
